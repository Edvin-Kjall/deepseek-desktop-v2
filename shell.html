<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Desktop</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body data-native-theme="dark">
  <header id="titlebar" title="Double-click to maximize">
    <div class="titlebar__brand">
      <img class="titlebar__logo" id="appLogo" alt="" width="22" height="22" src="build/icon.png" />
      <div class="titlebar__titles">
        <span class="titlebar__name" id="appTitle">DeepSeek Desktop</span>
        <span class="titlebar__sub">Chat</span>
      </div>
    </div>
    <div class="titlebar__actions">
      <button
        type="button"
        class="btn-icon"
        id="menuBtn"
        title="App menu (File, View, …)"
        aria-label="App menu"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="3" y="5" width="18" height="2" rx="0.5" />
          <rect x="3" y="11" width="18" height="2" rx="0.5" />
          <rect x="3" y="17" width="18" height="2" rx="0.5" />
        </svg>
      </button>
      <div class="caption-btns" id="winCaption">
        <button type="button" id="btnMin" class="btn-min" title="Minimize" aria-label="Minimize">
          <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor" /></svg>
        </button>
        <button type="button" id="btnMax" class="btn-max" title="Maximize" aria-label="Maximize / restore">
          <svg class="ic-max" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="0.5" y="0.5" width="9" height="9" />
          </svg>
          <svg class="ic-restore" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" style="display: none">
            <rect x="2" y="0.5" width="7" height="7" />
            <rect x="0.5" y="2.5" width="7" height="7" />
          </svg>
        </button>
        <button type="button" id="btnClose" class="caption-close" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
            <path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.1" fill="none" />
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div id="shell-filler" aria-hidden="true"></div>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const shell = window.shell;
      if (!shell) {
        return;
      }

      function setMaxIcon(isMax) {
        const maxEl = document.querySelector('.ic-max');
        const restEl = document.querySelector('.ic-restore');
        if (maxEl && restEl) {
          maxEl.style.display = isMax ? 'none' : 'block';
          restEl.style.display = isMax ? 'block' : 'none';
        }
        const btn = $('btnMax');
        if (btn) {
          btn.title = isMax ? 'Restore' : 'Maximize';
        }
      }

      shell
        .isMaximized()
        .then(setMaxIcon)
        .catch(() => {});

      if (typeof shell.onMaximizeChanged === 'function') {
        shell.onMaximizeChanged(setMaxIcon);
      }

      if (typeof shell.onNativeTheme === 'function') {
        shell.onNativeTheme((dark) => {
          document.body.setAttribute('data-native-theme', dark ? 'dark' : 'light');
        });
      }

      const tb = $('titlebar');
      if (tb) {
        tb.addEventListener('dblclick', (e) => {
          if (e.target && e.target.closest('button, .titlebar__actions')) {
            return;
          }
          shell.maximize();
        });
      }

      $('btnMin').addEventListener('click', () => shell.minimize());
      $('btnMax').addEventListener('click', () => shell.maximize());
      $('btnClose').addEventListener('click', () => shell.close());
      const menuBtn = $('menuBtn');
      menuBtn.addEventListener('click', (e) => {
        const r = menuBtn.getBoundingClientRect();
        shell.showAppMenu(Math.round(r.left), Math.round(r.bottom) + 2);
        e.stopPropagation();
      });
    })();
  </script>
</body>
</html>
